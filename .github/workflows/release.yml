# Build the offline bundles when a version tag (like v1.1.0) is pushed, and attach them to its
# GitHub release. "Run workflow" on GitHub builds them without a release (to test the build).
# GitHub allows files up to 2 GB, so each bundle is split into parts (see docs/offline.md).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read only by default. Each job asks for write itself, only where it needs it.
permissions:
  contents: read

# One release run per tag (or branch) at a time; a second one waits instead of racing the first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Before anything is published: the config checks pass, and a tag has its section in CHANGELOG.md.
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CHANGELOG.md has a section for this version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # v1.3.0 and v1.3.0-rc1 both need a "## 1.3.0" heading (a date may follow it).
          version=${GITHUB_REF_NAME#v}
          version=${version%%-*}
          grep -qE "^## ${version//./\\.}( |$)" CHANGELOG.md ||
            { echo "::error::CHANGELOG.md has no '## $version' section"; exit 1; }
      - name: Check config.example.yml and common config mistakes
        env:
          ANSIBRO_CONFIG: config.example.yml
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/ansible-galaxy collection install -r requirements.yml
          .venv/bin/python tests/test_config.py
          .venv/bin/python tests/test_handover.py

  # Make the release first, so the bundle jobs only add files to it.
  release:
    name: Release
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write  # to make the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a dash (v1.1.0-rc1) is a test release: marked as pre-release.
          pre=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo true || echo false)
          # The notes are this version's section of CHANGELOG.md (the check job made sure it is there).
          version=${GITHUB_REF_NAME#v}
          version=${version%%-*}
          awk -v v="$version" '/^## /{on = ($2 == v)} on' CHANGELOG.md | tail -n +2 > notes.md
          printf '\nOffline bundles: see docs/offline.md.\n' >> notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --prerelease="$pre" --title "$GITHUB_REF_NAME" --notes-file notes.md

  bundle:
    name: Bundle ${{ matrix.ubuntu }}
    needs: [check, release]
    if: always() && needs.check.result == 'success' && needs.release.result != 'failure'
    strategy:
      fail-fast: false  # one bundle failing does not stop the others
      matrix:
        ubuntu: ["24.04", "26.04"]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write  # to upload the bundles to the release (only the last step gets the token)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # build-bundle.sh does not need the token, so it is not left in .git
      - name: Make disk space (a bundle needs about 10 GB while it is built)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - name: Build the bundle
        run: ./build-bundle.sh ${{ matrix.ubuntu }}
      - name: Split it into parts of 1.9 GB
        run: |
          cd dist
          file=ansibro-${{ matrix.ubuntu }}.tar.gz
          sha256sum "$file" > "$file.sha256"
          split -b 1900m -d "$file" "$file.part"
          rm "$file"
          ls -lh
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/ansibro-* --clobber
