# Actions are pinned to a commit (the comment shows the version), like everything else here.
# Checks that run on GitHub after every push, every pull request,
# and every Monday (to catch pinned versions that were removed upstream).
name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # every Monday at 03:00 UTC
  workflow_dispatch: # adds a "Run workflow" button on GitHub

permissions:
  contents: read

jobs:
  # 1. The Ansible code has no common bugs, and config.example.yml is valid.
  ansible:
    name: Ansible
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANSIBRO_CONFIG: config.example.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no step needs the token, so it is not left in .git
      - name: Install Ansible
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt ansible-lint==26.10.1
          .venv/bin/ansible-galaxy collection install -r requirements.yml
      - name: Check config.example.yml and common config mistakes
        run: .venv/bin/python tests/test_config.py
      - name: Check state/handover.json has the facts and no password
        run: .venv/bin/python tests/test_handover.py
      - name: Check playbook syntax
        run: PATH="$PWD/.venv/bin:$PATH" ansible-playbook site.yml --syntax-check
      - name: Lint
        run: PATH="$PWD/.venv/bin:$PATH" ansible-lint --profile production

  # 2. The shell scripts have no common bugs.
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no step needs the token, so it is not left in .git
      - run: shellcheck install.sh build-bundle.sh scripts/*.sh

  # 3. Every image and package in versions.yml still exists (amd64).
  versions:
    name: Pinned versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no step needs the token, so it is not left in .git
      - run: scripts/validate-versions.sh

  # 4. Every link in the docs still works.
  links:
    name: Doc links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no step needs the token, so it is not left in .git
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Some websites block bots (403, 429) or answer slowly.
          # Only real errors, like 404 Not Found, fail this check.
          # --include-fragments also checks links to a heading (file.md#heading).
          args: >-
            --no-progress --include-fragments --accept 200..=299,403,429 --accept-timeouts --max-retries 3
            README.md THIRD_PARTY.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md CHANGELOG.md docs/*.md
            .claude/skills/*/SKILL.md .github/*.md
          fail: true

  # 5. Known security problems in the pinned images (a report on the run's page; it does not fail).
  scan:
    name: Image scan
    runs-on: ubuntu-latest
    timeout-minutes: 90  # pulls every pinned image
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no step needs the token, so it is not left in .git
      - run: scripts/scan-images.sh
