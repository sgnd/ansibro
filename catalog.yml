# Available apps. The installer first deploys all server apps (runs_on: node),
# then all swarm apps, each group in the order below.
#   category: only one app per category can be installed
#   runs_on:  swarm (swarm service) | node (docker compose on one server)
#   requires: apps or categories that must also be installed (optional),
#             e.g. "database" = postgres or mariadb
#   license:  the app's open-source license
#   info:     how to reach it, shown at the end of the install
#   servers:  how many servers it can run on, if more than one (optional), e.g. postgres: [db1, db2]
#   In info: <ip> = the server it runs on, <domain> = domain in config.yml,
#            <admin login> = the login on admin pages (Traefik, Authelia or Keycloak; see admin_login)

traefik:
  category: gateway
  runs_on: swarm
  license: MIT
  info: "https://traefik.<domain> (<admin login>)"

kong:
  category: api-gateway
  runs_on: swarm
  requires: [postgres, traefik]
  license: Apache-2.0
  info: "APIs at https://kong.<domain>, Kong Manager https://kong-manager.<domain> (<admin login>)"

portainer:
  category: management
  runs_on: swarm
  requires: [traefik]
  license: zlib
  info: "https://portainer.<domain> (user admin, password state/secrets/portainer_admin)"

swarmpit:
  category: management
  runs_on: swarm
  requires: [traefik]
  license: EPL-1.0
  info: "https://swarmpit.<domain> (user admin, password state/secrets/swarmpit_admin)"

keycloak:
  category: auth
  runs_on: swarm
  requires: [database, traefik]
  license: Apache-2.0
  info: "https://keycloak.<domain> (user admin, password state/secrets/keycloak_admin)"

authelia:
  category: auth
  runs_on: swarm
  requires: [database, cache, traefik]
  license: Apache-2.0
  info: "https://authelia.<domain> (user admin, password state/secrets/authelia_admin). Protect an app with the Traefik middleware authelia@file"

postgres:
  category: database
  runs_on: node
  servers: [1, 2, 3]  # 2 or more: Patroni, one primary and copies, automatic failover
  license: PostgreSQL
  info: "<ip>:5432 (user postgres, password state/secrets/postgres)"

mariadb:
  category: database
  runs_on: node
  servers: [1, 3]  # 3: a Galera cluster, every server has all the data
  license: GPL-2.0
  info: "<ip>:3306 (user root, password state/secrets/mariadb)"

redis:
  category: cache
  runs_on: node
  servers: [1, 3]  # 3: one primary, two copies, Sentinel picks a new primary by itself
  license: AGPL-3.0 (Redis 8 is tri-licensed, used under AGPL)
  info: "<ip>:6379 (password state/secrets/redis)"

valkey:
  category: cache
  runs_on: node
  servers: [1, 3]  # 3: one primary, two copies, Sentinel picks a new primary by itself
  license: BSD-3-Clause
  info: "<ip>:6379 (password state/secrets/valkey)"

rustfs:
  category: storage
  runs_on: node
  license: Apache-2.0
  info: "S3 http://<ip>:9000 (keys state/secrets/rustfs_access_key, rustfs_secret_key), console https://rustfs.<domain>/rustfs/console/ (needs traefik)"

garage:
  category: storage
  runs_on: node
  servers: [1, 3]  # 3 servers keep 3 copies of every file
  license: AGPL-3.0
  info: "S3 http://<ip>:3900, region garage (access key = GK + state/secrets/garage_access_key, secret key = state/secrets/garage_secret_key)"

rabbitmq:
  category: queue
  runs_on: node
  license: MPL-2.0
  info: "amqp://<ip>:5672 (user admin, password state/secrets/rabbitmq), UI https://rabbitmq.<domain> (needs traefik)"

nats:
  category: queue
  runs_on: node
  license: Apache-2.0
  info: "nats://<ip>:4222 (user admin, password state/secrets/nats). Monitoring https://nats.<domain> (needs traefik; <admin login>)"

uptimekuma:
  category: uptime
  runs_on: node
  requires: [traefik]
  license: MIT
  info: "https://uptimekuma.<domain> (user admin, password state/secrets/uptimekuma_admin). Monitors for every web page are made for you"

beszel:
  category: monitoring
  runs_on: node
  requires: [traefik]
  license: MIT
  info: "https://beszel.<domain> (user admin@<domain>, password state/secrets/beszel_admin). Agents run on every server"

victoria:
  category: monitoring
  runs_on: node
  requires: [traefik]
  license: Apache-2.0 (VictoriaMetrics, VictoriaLogs, Alertmanager), AGPL-3.0 (Grafana)
  info: "Grafana https://grafana.<domain> (user admin, password state/secrets/grafana_admin). Alerts
    https://alertmanager.<domain>, metrics https://metrics.<domain>/vmui, logs https://logs.<domain>/select/vmui (<admin login>)"

openbao:
  category: secrets
  runs_on: node
  license: MPL-2.0
  info: "http://<ip>:8200, https://openbao.<domain> (needs traefik) (root token state/secrets/openbao_root_token)"
