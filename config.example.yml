# Copy to config.yml and change it. Every setting is explained here.

domain: example.com        # web pages get <name>.example.com, for example traefik.example.com
tls: letsencrypt           # letsencrypt | selfsigned (no internet) | custom (your own files: tls_cert, tls_key)
acme_email: admin@example.com      # for tls: letsencrypt
# acme_server: https://acme-staging-v02.api.letsencrypt.org/directory
#                          # optional: another ACME server, e.g. Let's Encrypt staging for tests,
#                          # or one in your own network (step-ca) for offline installs
# acme_ca_cert: ./certs/acme-ca.pem # optional: CA certificate of that ACME server, if it is private
# tls_cert: ./certs/fullchain.pem   # for tls: custom, a wildcard cert for *.example.com
# tls_key: ./certs/privkey.pem      # paths are relative to this file
timezone: Asia/Jakarta

ssh:
  user: ubuntu             # needs passwordless sudo
  key: ~/.ssh/id_ed25519   # paths are relative to this file
  port: 22
  allow_from: []           # IPs or ranges that may SSH in, e.g. [203.0.113.0/24]. Empty = anyone

# Who may open the admin web pages: Traefik dashboard, Kong Manager, Portainer, Swarmpit,
# RabbitMQ, RustFS, NATS, Uptime Kuma, Beszel, OpenBao, Grafana, Alertmanager, the metrics and
# logs pages, and Keycloak's admin console (/admin). Example: [203.0.113.0/24]
# Empty = anyone on the internet, protected only by the logins: the installer warns about it.
# With authelia or keycloak installed, every admin page also asks for that login (with a second factor).
# (The Keycloak and Authelia login pages are for everyone, so they are not limited.)
admin_allow_from: []

# The installer owns the firewall: it removes rules you add by hand. Open your own ports here,
# for example a VPN. from is optional (default: anyone).
firewall_allow: []
#  - { port: 1194, proto: udp }
#  - { port: 9100, proto: tcp, from: 10.0.0.0/8 }

# Optional: an encrypted network (WireGuard) between all servers. Use it when servers talk over
# the internet or a network you do not trust. With WireGuard, ip never changes,
# even when a server's real address (host) changes.
# Every node then needs host, and ip is a new private address you pick, e.g. 10.99.0.11.
# Each host must be reachable from the other servers and from the installer.
# Open UDP port 51820 between the servers in your cloud firewall (security group).
wireguard: false

# The cluster: swarm (Docker Swarm, the default) or k3s (small Kubernetes). See docs/k3s.md.
# With k3s, write cluster instead of swarm for traefik, kong, portainer, keycloak and authelia.
# swarmpit manages Docker Swarm only.
# orchestrator: k3s

# Optional: back up every server each night with restic (encrypted). Use storage outside this cluster.
# repository: s3:https://<s3 server>/<bucket> (AWS S3, Wasabi, another cluster's RustFS or Garage, ...),
#   rest:https://user:pass@<host>/ (restic rest-server), or a folder that is mounted on every server.
# Each server gets its own repository, <repository>/servers/<server name>, with its own password, made for
# you in state/secrets/restic_<server name>: a server cannot read another server's backups. Without those
# passwords the backups cannot be read: keep a copy of state/ (and its key) outside the cluster.
# With S3, turn on versioning and Object Lock for the bucket, so a server that was broken into cannot delete
# the backups (docs/how-to.md, "Back up and restore"). Restore on new servers: ./install.sh -e restore=true
# backup:
#   repository: s3:https://s3.example.com/ansibro-backup
#   s3_access_key: AKIA...
#   s3_secret_key: ...
#   time: "02:00"          # every night at this time (in quotes)
#   keep_daily: 7          # how many backups to keep
#   keep_weekly: 4
#   keep_monthly: 6

# Needed with the victoria app: where alerts go. At least one of telegram, email, webhook.
# monitoring:
#   telegram: { bot_token: "123456:ABC...", chat_id: -1001234567890 }   # chat_id is a number
#   email:
#     to: ops@example.com
#     from: alerts@example.com
#     smarthost: smtp.example.com:587
#     username: alerts@example.com
#     password: ...
#     tls: true            # false only for a server without TLS (STARTTLS)
#   webhook: https://hooks.slack.com/services/...   # Slack, Discord, or any URL that takes Alertmanager's JSON
#   heartbeat_url: https://hc-ping.com/your-uuid    # optional: a heartbeat service outside the cluster (takes POST)
#   keep_days: 30          # how long metrics and logs are kept

# Your servers.
#   name: lowercase letters, numbers and -
#   ip:   the private IPv4 the servers use to talk to each other (the swarm uses it).
#         With wireguard: true, a new address on the WireGuard network.
#   host: optional, the server's own address, where the installer connects over SSH
#         (and WireGuard, when on). Use it when a server has more than one IP, like a
#         public IP for SSH and a private IP for the cluster. Default: same as ip.
#   role: manager    runs the swarm and swarm apps (have 1, 3 or 5 managers in total)
#         worker     runs swarm apps
#         standalone not in the swarm, runs server apps like databases
#   labels: optional tags for your own swarm placement rules, e.g. node.labels.tier == app.
#           The installer only adds labels; remove old ones by hand (sudo docker node update --label-rm <key> <node>).
#           You can leave labels out. (Cluster servers get a tier by themselves: data, app, gateway or control; see docs/how-it-works.md.)
nodes:
  - name: swarm1
    ip: 10.0.0.11
    # host: 203.0.113.11     # optional, see above
    role: manager
  - name: swarm2
    ip: 10.0.0.12
    role: worker
    labels:
      tier: app
  - name: data1
    ip: 10.0.0.21
    role: standalone

# Apps to install and where they run. Apps not listed are not installed.
#   swarm       = a cluster app: traefik, kong, portainer, swarmpit, keycloak, authelia
#   <node name> = runs on that server: databases, caches, storage, queues, monitoring
#   cluster     = the same as swarm (reads better with orchestrator: k3s). On k3s: all of the above but swarmpit
# One app per category. All apps are in catalog.yml.
apps:
  traefik: swarm           # needed by every app with a web page
  portainer: swarm         # or swarmpit
  # kong: swarm            # API gateway, needs postgres
  # keycloak: swarm        # login, or authelia (needs a database; authelia also a cache)
  postgres: data1          # or mariadb. Failover: postgres: [data1, data2], mariadb: [data1, data2, data3]
  redis: data1             # or valkey. On 3 servers with Sentinel (failover): redis: [data1, data2, data3]
  rustfs: data1            # or garage. 3 copies of every file: garage: [data1, data2, data3]
  rabbitmq: data1          # or nats
  # uptimekuma: swarm2     # checks that your sites answer. With victoria, put it on another server
  # openbao: data1         # secrets for your apps (passwords, API keys)
  # victoria: data1        # monitoring: metrics, logs and alerts (needs monitoring: above). Or beszel: light, no logs
