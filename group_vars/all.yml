swarm_leader: "{{ groups['managers'][0] }}"
# Every manager runs a registry with the same images, so images can still be pulled when one
# manager is down. Apps use the name below: managers find their own registry under it,
# the other servers the first manager's (set in /etc/hosts).
registry_host: registry.ansibro
registry_addr: "{{ registry_host }}:{{ registry_port }}"
registry_ip: "{{ node_ip if inventory_hostname in groups['managers'] else hostvars[swarm_leader].node_ip }}"
# The registry needs a login, so a container cannot push a fake image into it.
registry_user: ansibro
registry_password: "{{ lookup('ansible.builtin.password', secrets_dir ~ '/registry', chars=['ascii_letters', 'digits'], length=32) }}"

# Traefik runs on every manager, so the apps stay reachable when one manager is down. Point DNS
# to all of them. Let's Encrypt (and acme_server) checks a domain by calling it, and the call can
# reach another manager, so with them Traefik runs only on the first manager.
# On k3s Traefik runs on the tier=app servers (the workers, if there are any): every one of them,
# or with Let's Encrypt the first one only. No tier=app server (one server with a database): all of them.
traefik_k3s_nodes: >-
  {{ groups['swarm'] | map('extract', hostvars) | selectattr('node_labels.tier', 'equalto', 'app')
  | map(attribute='inventory_hostname') | list or groups['swarm'] }}
traefik_nodes: >-
  {{ (traefik_k3s_nodes[:1] if tls == 'letsencrypt' else traefik_k3s_nodes) if orchestrator == 'k3s'
  else [swarm_leader] if tls == 'letsencrypt' else groups['managers'] }}
# The address where the installer reaches Traefik (for example Keycloak's admin API).
traefik_ip: "{{ hostvars[traefik_nodes[0]].node_ip }}"

# The login on admin pages: Authelia, or Keycloak (through oauth2-proxy), or else the Traefik
# dashboard password. Authelia and Keycloak ask for a second factor (an authenticator app).
admin_sso: "{{ 'authelia' if 'authelia' in apps else 'keycloak' if 'keycloak' in apps else '' }}"
# That login in words, for the summary (catalog.yml info: <admin login>).
admin_login: >-
  {{ 'Authelia login: user admin, password state/secrets/authelia_admin' if admin_sso == 'authelia'
  else 'Keycloak login: user admin, password state/secrets/keycloak_sso_admin' if admin_sso == 'keycloak'
  else 'Traefik login: user admin, password state/secrets/traefik_admin' }}
# k3s: the tls part of every route. A route's own "tls: {}" would hide the entry point's
# Let's Encrypt setting, so with letsencrypt each route names it.
k3s_route_tls: "{{ {'certResolver': 'letsencrypt'} if tls == 'letsencrypt' else {} }}"
# k3s: that login as a Traefik middleware in the "ansibro" namespace.
k3s_admin_login: "{{ {'authelia': 'authelia', 'keycloak': 'oauth'}[admin_sso] | default('admin-auth') }}"
# The servers' own addresses, and on k3s the pod range (pods, and a server that calls its own Traefik).
# They always pass admin_allow_from: Uptime Kuma checks the pages from there.
admin_servers: "{{ groups['all'] | map('extract', hostvars, 'node_ip') | list + (['10.42.0.0/16'] if orchestrator == 'k3s' else []) }}"
# The same as a Traefik rule. Admin pages with their own login (Portainer, Grafana, ...) let these in
# without the Authelia or Keycloak login, so Uptime Kuma's checks (and other calls from the servers'
# ip) keep working. The app's own login still applies.
admin_servers_rule: >-
  {% for ip in admin_servers %}ClientIP(`{{ ip }}`){{ ' || ' if not loop.last else '' }}{% endfor %}

# Swarm apps without data run on servers with the label tier=app, if there are any
# (servers without server apps get it; see inventory.py).
swarm_app_constraint: >-
  {{ 'node.labels.tier == app' if groups['swarm'] | map('extract', hostvars, 'node_labels')
  | selectattr('tier', 'defined') | selectattr('tier', 'equalto', 'app') | list else '' }}

# Each app keeps its files in /opt/ansibro/<app>/ on the server it runs on.
apps_dir: /opt/ansibro

# Offline install: where the bundle goes on each server, and how apt uses it.
bundle_dir: "{{ apps_dir }}/bundle"
apt_env: "{{ {'APT_CONFIG': bundle_dir ~ '/apt.conf'} if offline else {} }}"

# Generated passwords, kept on the machine running the installer.
secrets_dir: "{{ playbook_dir }}/state/secrets"

# Where the database and cache run, for apps that need them (empty if not installed).
database_app: "{{ 'postgres' if 'postgres' in apps else 'mariadb' if 'mariadb' in apps else '' }}"
database_ip: "{{ hostvars[apps[database_app]].node_ip if database_app else '' }}"
# The database on more servers: PostgreSQL with Patroni or MariaDB with Galera (automatic failover).
postgres_patroni: "{{ app_nodes.postgres | default([]) | length > 1 }}"
mariadb_galera: "{{ app_nodes.mariadb | default([]) | length > 1 }}"
database_ha: "{{ postgres_patroni or mariadb_galera }}"
database_port: "{{ 5432 if database_app == 'postgres' else 3306 }}"
# MariaDB with Galera: database-proxy asks this port on each server if it is in sync (roles/mariadb).
mariadb_check_port: 9200
# Where cluster apps (kong, keycloak, authelia) reach the database. On more servers: database-proxy,
# which always goes to a server that takes writes.
database_host: >-
  {{ ('database-proxy_haproxy' if orchestrator == 'swarm' else 'database-proxy.ansibro.svc.cluster.local')
  if database_ha else database_ip }}
cache_app: "{{ 'redis' if 'redis' in apps else 'valkey' if 'valkey' in apps else '' }}"
cache_ip: "{{ hostvars[apps[cache_app]].node_ip if cache_app else '' }}"
# The cache on 3 servers: Sentinel (port 26379) on each one knows the primary.
cache_ha: "{{ cache_app != '' and app_nodes[cache_app] | length > 1 }}"
cache_password: "{{ lookup('ansible.builtin.password', secrets_dir ~ '/' ~ cache_app, chars=['ascii_letters', 'digits'], length=24) if cache_app else '' }}"

# ./install.sh -e remove_nodes=true removes servers from the swarm that are not in config.yml.
remove_nodes: false

# ./install.sh -e restore=true puts the newest backup back on new servers (see roles/backup).
restore: false

# The monitoring app with alerts to Telegram, email or a webhook (victoria), and its server. Empty if not installed.
# (beszel, the light choice, has its own agents and alert settings.)
monitoring_app: "{{ 'victoria' if 'victoria' in apps else '' }}"
monitoring_ip: "{{ hostvars[apps[monitoring_app]].node_ip if monitoring_app else '' }}"
# Alertmanager (victoria) asks for this login: its API can mute every alert. vmalert, Grafana,
# Uptime Kuma, Traefik and the installer log in with it. Made once, in state/secrets/alertmanager.
alertmanager_user: ansibro
alertmanager_password: "{{ lookup('ansible.builtin.password', secrets_dir ~ '/alertmanager', chars=['ascii_letters', 'digits'], length=32) }}"
