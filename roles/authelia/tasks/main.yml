# Authelia: login page in front of your apps. Stores data in PostgreSQL or MariaDB,
# sessions in Redis or Valkey. Runs on the first manager (it keeps the users file there).
# Protect an app by adding the Traefik middleware "authelia@file" to its router.

- name: Create Authelia database
  ansible.builtin.include_role:
    name: "{{ database_app }}"
    tasks_from: database
  vars:
    postgres_db_name: authelia
    postgres_db_password: "{{ authelia_db_password }}"
    mariadb_db_name: authelia
    mariadb_db_password: "{{ authelia_db_password }}"

- name: Create Authelia folder
  ansible.builtin.file:
    path: "{{ authelia_dir }}/config"
    state: directory
    mode: "0700"

- name: Write Authelia config
  ansible.builtin.template:
    src: configuration.yml.j2
    dest: "{{ authelia_dir }}/config/configuration.yml"
    mode: "0600"
  diff: false  # has secrets
  register: authelia_config

- name: Mirror Authelia image
  ansible.builtin.include_role:
    name: registry
    tasks_from: mirror
  vars:
    registry_mirror_images: [authelia]

# Only the first time. After that, users.yml is yours to edit (add users, change passwords).
- name: Check users file
  ansible.builtin.stat:
    path: "{{ authelia_dir }}/config/users.yml"
  register: authelia_users

# Authelia makes the admin password and its hash itself, so the password is never on a command line.
- name: Make admin password
  ansible.builtin.command: >-
    docker run --rm {{ image_ref.authelia }}
    authelia crypto hash generate argon2 --random --random.length 24 --random.charset alphanumeric
  register: authelia_hash
  when: not authelia_users.stat.exists
  changed_when: false
  no_log: true

- name: Create the secrets folder
  ansible.builtin.file:
    path: "{{ secrets_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Save admin password to state/secrets/authelia_admin
  ansible.builtin.copy:
    dest: "{{ secrets_dir }}/authelia_admin"
    content: "{{ authelia_hash.stdout_lines[0] | regex_replace('^Random Password: ', '') }}\n"
    mode: "0600"
  delegate_to: localhost
  become: false
  when: not authelia_users.stat.exists
  no_log: true

- name: Write users file with the admin user
  ansible.builtin.copy:
    dest: "{{ authelia_dir }}/config/users.yml"
    content: |
      users:
        admin:
          displayname: Admin
          email: admin@{{ domain }}
          password: "{{ authelia_hash.stdout_lines[1] | regex_replace('^Digest: ', '') }}"
    mode: "0600"
  when: not authelia_users.stat.exists
  no_log: true

- name: Write Authelia stack
  when: orchestrator == 'swarm'
  ansible.builtin.template:
    src: stack.yml.j2
    dest: "{{ authelia_dir }}/stack.yml"
    mode: "0600"
  register: authelia_stack

- name: Deploy Authelia
  when: orchestrator == 'swarm'
  ansible.builtin.include_role:
    name: swarm
    tasks_from: deploy
  vars:
    swarm_stack: authelia
    swarm_stack_changed: "{{ authelia_stack.changed }}"


# k3s: a manifest in k3s's folder; k3s applies it by itself.
- name: Write Authelia for k3s
  ansible.builtin.template:
    src: k3s.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/ansibro-authelia.yaml
    mode: "0600"
  diff: false  # has passwords
  when: orchestrator == 'k3s'
