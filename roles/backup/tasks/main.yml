# Nightly backup of every server with restic (backup: in config.yml).
# The script /usr/local/bin/ansibro-backup says what it saves. See docs/how-to.md, "Back up and restore".

- name: Write backup settings
  ansible.builtin.import_tasks: settings.yml

# The first manager also keeps a copy of config.yml and state/, so they are in the backup too.
- name: Create folder for the installer files
  ansible.builtin.file:
    path: "{{ backup_dir }}/installer"
    state: directory
    mode: "0700"
  when: inventory_hostname == swarm_leader

- name: Copy config.yml for the backup
  ansible.builtin.copy:
    src: "{{ lookup('env', 'ANSIBRO_CONFIG') }}"
    dest: "{{ backup_dir }}/installer/config.yml"
    mode: "0600"
  when: inventory_hostname == swarm_leader
  diff: false  # may have keys

# Only the passwords: state/summary.md is made again by every install (and its date changes each time).
- name: Copy state/ for the backup
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/state/secrets/"
    dest: "{{ backup_dir }}/installer/state/secrets/"
    mode: "0600"
    directory_mode: "0700"
  when: inventory_hostname == swarm_leader
  diff: false  # has passwords

# One server at a time: with a shared repository (S3, rest-server) the first one creates it,
# with a folder each server has its own. "init" first: it stops at once when the repository is
# there. (restic 0.17 and newer try a missing S3 bucket again for 15 minutes, so "cat config" first
# could wait that long.)
- name: Create the backup repository if it is not there
  ansible.builtin.shell: set -a && . {{ backup_dir }}/restic.env && (restic init 2>&1 || restic cat config >/dev/null)
  register: backup_repo
  changed_when: "'created restic repository' in backup_repo.stdout"
  throttle: 1
  # Some S3 servers show a new repository a moment later; the next try then finds it.
  retries: 3
  delay: 5
  until: backup_repo.rc == 0

- name: Write the backup script
  ansible.builtin.template:
    src: ansibro-backup.sh.j2
    dest: /usr/local/bin/ansibro-backup
    mode: "0700"

- name: Write the backup service
  ansible.builtin.copy:
    dest: /etc/systemd/system/ansibro-backup.service
    content: |
      [Unit]
      Description=Ansibro backup
      After=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/ansibro-backup
    mode: "0644"

- name: Write the backup timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/ansibro-backup.timer
    content: |
      [Unit]
      Description=Ansibro backup every night

      [Timer]
      OnCalendar=*-*-* {{ backup_time }}:00
      # If the server was off at that time, back up when it starts.
      Persistent=true

      [Install]
      WantedBy=timers.target
    mode: "0644"

- name: Start the backup timer
  ansible.builtin.systemd_service:
    name: ansibro-backup.timer
    state: started
    enabled: true
    daemon_reload: true

# The first backup runs now, so a wrong repository or key shows up during the install.
- name: Look for an earlier backup of this server
  ansible.builtin.stat:
    path: "{{ backup_dir }}/last-success"
  register: backup_last

- name: Run the first backup
  ansible.builtin.command: /usr/local/bin/ansibro-backup
  when: not backup_last.stat.exists
  changed_when: true
