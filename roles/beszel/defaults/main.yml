beszel_dir: "{{ apps_dir }}/beszel"
beszel_agent_dir: "{{ apps_dir }}/beszel-agent"
beszel_agent_port: 45876

# Generated once and saved in state/secrets/ on the installer machine.
beszel_password: "{{ lookup('ansible.builtin.password', secrets_dir ~ '/beszel_admin', chars=['ascii_letters', 'digits'], length=24) }}"

# What the Beszel agent may ask Docker for (GET only, through docker-proxy in agent-compose.yml.j2):
# the list of containers, their settings, stats and logs.
beszel_socket_proxy_get: '^/(v[0-9.]+/)?(_ping|version|info|containers/json|containers/[a-zA-Z0-9_.-]+/(json|stats|logs))$'
