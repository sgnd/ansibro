# Servers that are still in the swarm but no longer in config.yml. Runs on the first manager,
# before anything else changes. They are only removed with ./install.sh -e remove_nodes=true,
# so a typo in config.yml cannot throw a server out of the swarm. Their containers move to the others.

- name: Get cluster servers
  ansible.builtin.command: "{{ cleanup_list_nodes[orchestrator] }}"
  vars:
    cleanup_list_nodes:
      swarm: docker node ls --format '{% raw %}{{ .Hostname }}{% endraw %}'
      k3s: k3s kubectl get nodes -o name
  register: cleanup_nodes
  failed_when: false  # no cluster yet (a new install)
  changed_when: false

- name: Get swarm managers
  ansible.builtin.command: docker node ls --filter role=manager --format '{% raw %}{{ .Hostname }}{% endraw %}'
  register: cleanup_managers
  failed_when: false
  changed_when: false
  when: orchestrator == 'swarm'

- name: Stop if servers would be removed by accident
  ansible.builtin.fail:
    msg: >-
      These servers are in the swarm but not in config.yml: {{ cleanup_old_nodes | join(', ') }}.
      To remove them from the swarm, run ./install.sh -e remove_nodes=true (move their server apps first).
      If they should stay, add them back to config.yml.
  when: cleanup_old_nodes | length > 0 and not remove_nodes | bool

# A manager leaves as a worker first, so the other managers keep their majority.
- name: Demote removed managers
  ansible.builtin.command: docker node demote {{ item }}
  loop: "{{ cleanup_managers.stdout_lines | default([]) | intersect(cleanup_old_nodes) }}"
  changed_when: true

- name: Remove servers from the swarm
  ansible.builtin.command: docker node rm --force {{ item }}
  loop: "{{ cleanup_old_nodes }}"
  when: orchestrator == 'swarm'
  changed_when: true

# k3s: the address to reach a removed server: its label ansibro-host (set by roles/k3s), or else its
# cluster address (InternalIP). Read it before the server is deleted.
- name: Find the address of removed k3s servers
  ansible.builtin.shell: |
    set -o pipefail
    k3s kubectl get node {{ item }} -o jsonpath='{.metadata.labels.ansibro-host}' | grep . \
      || k3s kubectl get node {{ item }} -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}'
  args:
    executable: /bin/bash
  loop: "{{ cleanup_old_nodes }}"
  register: cleanup_k3s_hosts
  failed_when: false
  changed_when: false
  when: orchestrator == 'k3s'

# k3s moves their pods to other servers. A removed k3s server also leaves etcd this way.
- name: Remove servers from k3s
  ansible.builtin.command: k3s kubectl delete node {{ item }}
  loop: "{{ cleanup_old_nodes }}"
  when: orchestrator == 'k3s'
  changed_when: true

# Deleting the node does not stop k3s on that server: it would join again. So stop it there.
# It is reached at its address with the same SSH settings as the other servers. (Not with add_host:
# that would keep the removed server in the inventory, and the next plays would set it up again.)
# A server that does not answer is skipped. Stops k3s and its containers, and removes its services
# (so the server can join again later, also with another role).
- name: Stop k3s on removed servers
  ansible.builtin.shell: |
    set -o pipefail
    for unit in k3s k3s-agent; do
      systemctl disable --now "$unit" 2>/dev/null || true
      rm -f "/etc/systemd/system/$unit.service"
    done
    systemctl daemon-reload
    # [a]: so pkill does not match this shell itself (its command line has the text too).
    pkill -f '/var/lib/rancher/k3s/dat[a]/' || true
    # Its pod network too (like k3s-killall.sh): when the server joins again it gets a new pod
    # range, and old interfaces would leave its pods without a route. The ufw rules stay.
    for link in cni0 flannel.1 flannel-v6.1 flannel-wg kube-ipvs0; do
      ip link delete "$link" 2>/dev/null || true
    done
    rm -rf /var/lib/cni/ /run/flannel/  # old pod addresses, and the old pod range for new pods
    iptables-save | grep -v KUBE- | grep -v CNI- | grep -iv flannel | iptables-restore
    ip6tables-save | grep -v KUBE- | grep -v CNI- | grep -iv flannel | ip6tables-restore
  args:
    executable: /bin/bash
  # (Ansible reads delegate_to even for an item that "when" skips, like all items on Swarm.)
  delegate_to: "{{ item.stdout | default('', true) or inventory_hostname }}"
  vars:  # (delegate_to gives the address; these vars cannot use item)
    ansible_user: "{{ hostvars[inventory_hostname].ansible_user }}"
    ansible_port: "{{ hostvars[inventory_hostname].ansible_port }}"
    ansible_ssh_private_key_file: "{{ hostvars[inventory_hostname].ansible_ssh_private_key_file }}"
  loop: "{{ cleanup_k3s_hosts.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: orchestrator == 'k3s' and item.stdout | default('') != ''
  ignore_unreachable: true
  changed_when: true
  register: cleanup_k3s_stop

# A server that did not answer still runs k3s, and would join the cluster again by itself.
- name: Say which removed servers still run k3s
  ansible.builtin.debug:
    msg: >-
      {{ item.item.item }} did not answer, so k3s still runs there. Stop it there by hand, or it joins
      again: sudo systemctl disable --now k3s k3s-agent
  loop: "{{ cleanup_k3s_stop.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item | default('') }}"
  when: orchestrator == 'k3s' and (item.unreachable | default(false) or (item.item.stdout | default('')) == '')
