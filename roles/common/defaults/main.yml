common_packages:
  - ca-certificates
  - curl
  - gnupg
  - chrony
  - ufw
  - jq
  - wireguard-tools  # for wireguard: true (small, so always installed)
  - restic           # for backup:
  - age              # to keep state/ encrypted when the installer runs here (scripts/state.sh)
  - fail2ban         # bans IPs that keep failing SSH logins (tasks/hardening.yml)
  - python3-systemd  # lets fail2ban read the SSH log from journald
  - unattended-upgrades  # automatic security updates

common_sysctl:
  net.ipv4.ip_forward: 1
  net.core.somaxconn: 4096
  vm.max_map_count: 262144
  vm.swappiness: 10
  fs.inotify.max_user_watches: 524288
  fs.inotify.max_user_instances: 1024

common_journald_max_use: 1G

# fail2ban never bans these: the other cluster servers and ssh.allow_from.
common_fail2ban_ignore: "{{ (common_cluster_hosts + common_cluster_ips + (common_ssh_allow_from | difference(['any']))) | unique }}"

# Firewall inputs (see tasks/firewall.yml).
common_ssh_allow_from: "{{ (ssh.allow_from | default([])) or ['any'] }}"
common_cluster_ips: "{{ groups['all'] | difference([inventory_hostname]) | map('extract', hostvars, 'node_ip') | sort }}"
# The real addresses (host) of the other servers, which answer SSH.
common_cluster_hosts: "{{ groups['all'] | difference([inventory_hostname]) | map('extract', hostvars, 'node_host') | unique | sort }}"
# SSH is open to these: ssh.allow_from (or anyone), plus the other cluster servers' host.
common_ssh_from: "{{ common_ssh_allow_from if common_ssh_allow_from == ['any'] else (common_ssh_allow_from + common_cluster_hosts) | unique }}"
# With wireguard: the real addresses of the other servers, which send WireGuard traffic.
common_wireguard_hosts: "{{ groups['all'] | difference([inventory_hostname]) | map('extract', hostvars, 'node_host') | sort if wireguard else [] }}"

# Ports the other cluster servers may use on this server. Every other port is closed to them too.
# An app on its own server (Docker Compose) and the ports it needs:
common_app_ports:
  postgres: [5432, 8008]                    # 8008: Patroni (PostgreSQL on more servers)
  mariadb: [3306, 4444, 4567, 4568, 9200]    # 4444, 4567, 4568: Galera (on 3 servers), 9200: its check
  redis: [6379, 26379]                      # 26379: Sentinel (on 3 servers)
  valkey: [6379, 26379]
  rustfs: [9000, 9001]
  garage: [3900, 3901]                      # S3, and Garage servers talking to each other
  rabbitmq: [5672, 15672, 15692]            # AMQP, web page, metrics
  nats: [4222, 8222]
  uptimekuma: [3001]
  beszel: [8090]
  openbao: [8200, 8201]
  victoria: [8428, 9428, 8880, 9093, 3000]  # metrics, logs, rules, alerts, Grafana
# All ports this server opens to the other cluster servers:
#   5000 registry (managers), the Swarm or k3s ports, 8082 Traefik metrics (for monitoring),
#   9100 9280 9598 9187 9104 9121 monitoring agents
#   (node exporter, cAdvisor, Vector, PostgreSQL/MariaDB/Redis exporters),
#   45876 Beszel agent, and the ports of the apps on this server (common_app_ports).
#   The agent ports are the same as in roles/observability/defaults/main.yml.
common_cluster_tcp_ports: >-
  {{ (([registry_port] if inventory_hostname in groups['managers'] else [])
  + (common_swarm_tcp_ports if orchestrator == 'swarm' else common_k3s_tcp_ports)
  + ([8082] if monitoring_app and 'traefik' in apps and inventory_hostname in traefik_nodes else [])
  + ([9100, 9280, 9598, 9187, 9104, 9121] if monitoring_app else [])
  + ([45876] if 'beszel' in apps else [])
  + (node_apps | map('extract', common_app_ports) | flatten))
  | unique | sort }}
# etcd for Patroni (on the managers, with PostgreSQL on 2 or more servers) has its own rules, not
# common_cluster_tcp_ports: its peer port 12380 is open only to the other managers, its client port
# 12379 only to the PostgreSQL servers. No container reaches either (see tasks/firewall.yml).
common_etcd: "{{ postgres_patroni and inventory_hostname in groups['managers'] }}"
common_etcd_peer_ips: >-
  {{ groups['managers'] | difference([inventory_hostname]) | map('extract', hostvars, 'node_ip') | sort
  if common_etcd else [] }}
common_etcd_client_ips: >-
  {{ app_nodes.postgres | default([]) | difference([inventory_hostname]) | map('extract', hostvars, 'node_ip') | sort
  if common_etcd else [] }}
common_etcd_ports: [12379, 12380]

# Swarm: managers 2377, node discovery 7946 and the overlay networks 4789/udp.
common_swarm_tcp_ports: >-
  {{ ([2377] if inventory_hostname in groups['managers'] else [])
  + ([7946] if inventory_hostname in groups['swarm'] else []) }}
# k3s: API 6443 and etcd 2379-2380 on servers, kubelet 10250, flannel (pod network) 8472/udp.
common_k3s_tcp_ports: >-
  {{ ([6443, 2379, 2380] if inventory_hostname in groups['managers'] else [])
  + ([10250] if inventory_hostname in groups['swarm'] else []) }}
common_cluster_udp_ports: >-
  {{ [] if inventory_hostname not in groups['swarm']
  else [7946, 4789] if orchestrator == 'swarm' else [8472] }}
# k3s: its pods (10.42.0.0/16) reach the server's own ports (DNS, apps on the host network).
# cni0: pods on this server. flannel.1: the pod network between the servers (flannel's vxlan).
common_k3s_interfaces: "{{ ['cni0', 'flannel.1'] if orchestrator == 'k3s' and inventory_hostname in groups['swarm'] else [] }}"

# docker0: default bridge. docker_gwbridge: how swarm containers reach the host.
# br+: every Docker Compose network (br-<id>; + matches any name that starts with br).
common_docker_interfaces: [docker0, docker_gwbridge, br+]

# This server answers on 80 and 443: Traefik runs here (traefik_nodes in group_vars).
common_web: "{{ 'traefik' in apps and inventory_hostname in traefik_nodes }}"
