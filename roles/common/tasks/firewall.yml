# Firewall: deny everything, then open only what we need.
#
# The wanted rules are saved in a file. When that file changes (for example a new
# ssh.allow_from or a removed node), the firewall is reset and rebuilt, so old rules go away.
# Rules added by hand are removed too: put your own in firewall_allow in config.yml.
# (During a rebuild the firewall is off for a few seconds.)

- name: Save wanted firewall rules
  ansible.builtin.copy:
    dest: /etc/ufw/ansibro-rules.txt
    content: |
      # Managed by ansibro. Change config.yml instead of this file.
      ssh {{ ansible_port }} from {{ common_ssh_from | join(', ') }}
      web 80, 443: {{ common_web }}
      cluster nodes: {{ common_cluster_ips | join(', ') }}
      cluster tcp: {{ common_cluster_tcp_ports | join(', ') }}
      cluster udp: {{ common_cluster_udp_ports | join(', ') }}
      etcd peers from: {{ common_etcd_peer_ips | join(', ') }}
      etcd clients from: {{ common_etcd_client_ips | join(', ') }}
      etcd closed to containers: {{ common_etcd }}
      k3s pods on: {{ common_k3s_interfaces | join(', ') }}
      wireguard from: {{ common_wireguard_hosts | join(', ') }}
      ssh replies from: {{ common_cluster_hosts | join(', ') }}
      docker interfaces: {{ common_docker_interfaces | join(', ') }}
      your rules: {{ firewall_allow | default([]) | to_json }}
    mode: "0644"
  register: common_firewall_rules

# Not a handler: the reset must happen now, before the rules below are added again.
- name: Reset firewall because the rules changed
  ansible.builtin.command: ufw --force reset
  when: common_firewall_rules.changed  # noqa: no-handler
  changed_when: true

# From ssh.allow_from (or anyone), and always from the other cluster servers: the installer
# may run on the first manager (an offline install does), and connects from there to the others.
- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "{{ ansible_port | string }}"
    proto: tcp
    from_ip: "{{ item }}"
  loop: "{{ common_ssh_from }}"

- name: Allow your own rules (firewall_allow)
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: "{{ item.proto | default('tcp') }}"
    from_ip: "{{ item.from | default('any') }}"
  loop: "{{ firewall_allow | default([]) }}"

# Only where Traefik runs (traefik_nodes in group_vars): the other servers need no web ports.
- name: Allow HTTP and HTTPS where Traefik runs
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["80", "443"]
  when: common_web

# Other cluster servers may use only the ports this server needs to offer: swarm, registry,
# the apps on it and the monitoring agents (see common_cluster_tcp_ports). Up to 15 ports per rule.
- name: Allow app and swarm TCP ports from other cluster nodes
  community.general.ufw:
    rule: allow
    from_ip: "{{ item.0 }}"
    port: "{{ item.1 | join(',') }}"
    proto: tcp
  loop: "{{ common_cluster_ips | product(common_cluster_tcp_ports | batch(15) | list) | list }}"

# etcd for Patroni (managers only): the peer port for the other managers, the client port for the
# PostgreSQL servers. (A container on another server comes from its server's IP: see DOCKER-USER below.)
- name: Allow etcd's peer port from the other managers
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    port: "12380"
    proto: tcp
  loop: "{{ common_etcd_peer_ips }}"

- name: Allow etcd's client port from the PostgreSQL servers
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    port: "12379"
    proto: tcp
  loop: "{{ common_etcd_client_ips }}"

- name: Allow swarm UDP ports from other cluster nodes
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    port: "{{ common_cluster_udp_ports | join(',') }}"
    proto: udp
  loop: "{{ common_cluster_ips }}"
  when: common_cluster_udp_ports | length > 0

# No container (or k3s pod) on this server may reach etcd: anyone who can write Patroni's keys can
# pick the primary or change PostgreSQL's settings. The firewall takes the first rule that matches,
# so this comes before the rules that let containers and pods in.
- name: Keep containers away from etcd
  community.general.ufw:
    rule: deny
    direction: in
    interface: "{{ item }}"
    to_port: "{{ common_etcd_ports | join(':') }}"
    proto: tcp
  loop: "{{ common_k3s_interfaces + common_docker_interfaces }}"
  when: common_etcd

# k3s: pods on this server (cni0) and pods of other servers (flannel.1, the pod network) may use
# this server's ports, for example DNS or a server app. Only from the pod range, only on those interfaces.
- name: Allow k3s pods
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ item }}"
    from_ip: 10.42.0.0/16
  loop: "{{ common_k3s_interfaces }}"

- name: Allow WireGuard from other cluster nodes
  community.general.ufw:
    rule: allow
    port: "{{ wireguard_port | string }}"
    proto: udp
    from_ip: "{{ item }}"
  loop: "{{ common_wireguard_hosts }}"

# When the installer runs on a server, it talks to the others over SSH. The firewall lets their
# replies in only while it remembers the connection, and it forgets when it starts or Docker starts.
# Then the install hangs. So always let SSH replies from the other servers in. (The "Allow SSH" rule
# above is for new connections to this server; these are replies to connections from this server.)
# Replies come back to a short-lived local port (32768-60999 on Linux), so only those are opened.
- name: Allow SSH replies from other cluster nodes
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: "{{ item }}"
    from_port: "{{ ansible_port | string }}"
    port: "32768:60999"
  loop: "{{ common_cluster_hosts }}"

# Containers on this server can reach apps that use the host network
# (also containers on your own Docker Compose networks: br-<id>).
- name: Allow traffic from local Docker networks
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ item }}"
  loop: "{{ common_docker_interfaces }}"

# Ports that Docker publishes skip the rules above (Docker sends them on before ufw sees them).
# Traefik's metrics port 8082 is one: only the other cluster servers may use it.
# (On k3s a NetworkPolicy in roles/traefik does this limit instead.)
# A container that calls another server goes out with this server's IP, so the other server cannot
# tell it from the server itself. etcd's ports are dropped here, before the container's call leaves.
# Docker checks the DOCKER-USER chain first, so these limits go there.
- name: Remove the old Docker port limit (now in the block below)
  ansible.builtin.blockinfile:
    path: /etc/ufw/after.rules
    marker: "# {mark} ANSIBRO TRAEFIK METRICS"
    state: absent
  register: common_docker_user_old

- name: Limit what containers reach through Docker
  ansible.builtin.blockinfile:
    path: /etc/ufw/after.rules
    marker: "# {mark} ANSIBRO DOCKER-USER"
    block: |
      *filter
      :DOCKER-USER - [0:0]
      {% if common_traefik_metrics_limit %}
      {% for ip in common_cluster_ips %}
      -A DOCKER-USER -p tcp -m conntrack --ctorigdstport 8082 --ctdir ORIGINAL -s {{ ip }} -j RETURN
      {% endfor %}
      -A DOCKER-USER -p tcp -m conntrack --ctorigdstport 8082 --ctdir ORIGINAL -j DROP
      {% endif %}
      {% if postgres_patroni %}
      -A DOCKER-USER -p tcp -m multiport --dports {{ common_etcd_ports | join(',') }} -j DROP
      {% endif %}
      -A DOCKER-USER -j RETURN
      COMMIT
    state: "{{ 'present' if common_traefik_metrics_limit or postgres_patroni else 'absent' }}"
  register: common_docker_user
  vars:
    common_traefik_metrics_limit: "{{ orchestrator == 'swarm' and 8082 in common_cluster_tcp_ports }}"

- name: Enable firewall
  community.general.ufw:
    state: enabled
    direction: incoming
    policy: deny

- name: Load the changed Docker port limit
  ansible.builtin.command: ufw reload
  when: common_docker_user.changed or common_docker_user_old.changed  # noqa: no-handler
  changed_when: true
