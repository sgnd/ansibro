# Install Docker from the official apt repo (or the offline bundle), with versions from versions.yml.

- name: Add Docker apt key
  ansible.builtin.get_url:
    url: "{{ docker_apt_url }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  when: not offline

- name: Add Docker apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: >
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      {{ docker_apt_url }} {{ ansible_distribution_release }} stable
    mode: "0644"
  when: not offline

- name: Get installed packages
  ansible.builtin.package_facts:

- name: Install Docker packages (new server)
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    update_cache: true
    allow_change_held_packages: true
    allow_downgrade: true
  when: "'docker-ce' not in ansible_facts.packages"

- name: Configure Docker daemon
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: "0644"
  register: docker_config

# A new Docker version or daemon.json restarts Docker. One server at a time, and each one must be
# back in the swarm before the next one starts, so the swarm keeps running.
# (The loop runs update.yml for one server after the other.)
- name: Update and restart Docker, one server at a time
  ansible.builtin.include_tasks: update.yml
  loop: "{{ ansible_play_hosts }}"
  loop_control:
    loop_var: docker_host
  when: docker_host == inventory_hostname

# Hold = "apt upgrade" (and unattended-upgrades) will not change the Docker version.
# After the update: installing a version with apt takes the hold away.
- name: Hold Docker packages
  ansible.builtin.dpkg_selections:
    name: "{{ item.split('=')[0] }}"
    selection: hold
  loop: "{{ docker_packages }}"

- name: Start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
