# etcd on every manager, for Patroni (PostgreSQL on 2 or more servers). It holds no app data.
# The firewall lets only the other managers (peer port) and the PostgreSQL servers (client port) in,
# no container, and etcd asks for a login (user patroni; tasks/auth.yml turns it on).

- name: Create etcd folders
  ansible.builtin.file:
    path: "{{ etcd_dir }}/data"
    state: directory
    mode: "0700"

- name: Mirror etcd image
  ansible.builtin.include_role:
    name: registry
    tasks_from: mirror
  vars:
    registry_mirror_images: [etcd]

# etcd's members are fixed when it first starts. With a manager added or removed later, the new
# members would start a second, separate etcd (and Patroni could get two primaries). Stop instead.
- name: Read etcd's managers
  ansible.builtin.slurp:
    src: "{{ etcd_dir }}/managers"
  register: etcd_managers
  failed_when: false

# Only managers that have the file count: a new manager has none yet, and a manager that is down
# now has no answer at all. (A new manager is still found: the others have the old list.)
- name: Check the managers did not change
  ansible.builtin.assert:
    that: etcd_seen | difference([groups['managers'] | join(',')]) | length == 0
    fail_msg: >-
      The managers changed, and etcd (for PostgreSQL with Patroni) cannot follow by itself.
      See "Add or remove a manager with PostgreSQL on more servers" in docs/how-to.md.
  vars:
    etcd_seen: >-
      {{ groups['managers'] | map('extract', hostvars) | selectattr('etcd_managers', 'defined')
      | map(attribute='etcd_managers') | selectattr('content', 'defined') | map(attribute='content')
      | map('b64decode') | map('trim') | select | unique | list }}
  run_once: true

- name: Write etcd compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ etcd_dir }}/compose.yml"
    mode: "0600"

- name: Look for etcd data
  ansible.builtin.stat:
    path: "{{ etcd_dir }}/data/member"
  register: etcd_data

# A new cluster: all members at once, each waits for the others to form the cluster.
- name: Start a new etcd cluster
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ etcd_dir }}"
  register: etcd_up
  changed_when: "'Started' in etcd_up.stderr or 'Recreated' in etcd_up.stderr"
  when: not etcd_data.stat.exists

# A running cluster: one member at a time, the next one only when this one is back. So etcd keeps
# its quorum while a change (a new image, a new setting) restarts its members, and Patroni keeps it too.
- name: Start etcd one member at a time
  ansible.builtin.include_tasks: restart.yml
  loop: >-
    {{ groups['managers'] | intersect(ansible_play_hosts) | map('extract', hostvars)
    | selectattr('etcd_data.stat.exists') | map(attribute='inventory_hostname') | list }}
  loop_control:
    loop_var: etcd_member
  run_once: true

# /health answers without a login, also when etcd asks for one.
- name: Wait for etcd
  ansible.builtin.uri:
    url: "http://{{ node_ip }}:{{ etcd_client_port }}/health"
  register: etcd_health
  until: (etcd_health.json | default({})).health | default('') == 'true'
  retries: 30
  delay: 5

- name: Remember etcd's managers
  ansible.builtin.copy:
    dest: "{{ etcd_dir }}/managers"
    content: "{{ groups['managers'] | join(',') }}\n"
    mode: "0600"

# The users root (for the installer) and patroni. The login itself is turned on later (tasks/auth.yml),
# once every Patroni has its password: Patroni works with and without it.
- name: Set up etcd's users
  ansible.builtin.include_tasks: users.yml
  args:
    apply:
      run_once: true
