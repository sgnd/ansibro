# Keycloak: single sign-on (OIDC, SAML). Stores its data in PostgreSQL or MariaDB.
# Admin console: https://keycloak.<domain>

- name: Create Keycloak database
  ansible.builtin.include_role:
    name: "{{ database_app }}"
    tasks_from: database
  vars:
    postgres_db_name: keycloak
    postgres_db_password: "{{ keycloak_db_password }}"
    mariadb_db_name: keycloak
    mariadb_db_password: "{{ keycloak_db_password }}"

- name: Create Keycloak folder
  ansible.builtin.file:
    path: "{{ keycloak_dir }}"
    state: directory
    mode: "0700"

- name: Mirror Keycloak image
  ansible.builtin.include_role:
    name: registry
    tasks_from: mirror
  vars:
    registry_mirror_images: "{{ ['keycloak'] + (['oauth2-proxy'] if admin_sso == 'keycloak' else []) }}"

# Swarm: the passwords reach the containers as swarm secrets (files in /run/secrets), not in their
# settings: whoever may read the swarm's services (Traefik, through socket-proxy, for one) does not
# see them. A swarm secret cannot change, so its name has the file's checksum: a new password is a new secret.
- name: Create the folder for Keycloak's secrets
  ansible.builtin.file:
    path: "{{ keycloak_dir }}/secrets"
    state: directory
    mode: "0700"
  when: orchestrator == 'swarm'

- name: Write Keycloak's secrets
  ansible.builtin.copy:
    dest: "{{ keycloak_dir }}/secrets/{{ item.name }}"
    content: "{{ item.value }}"
    mode: "0600"
  loop:
    - { name: db_password, value: "{{ keycloak_db_password }}" }
    - { name: admin_password, value: "{{ keycloak_admin_password }}" }
    - { name: oauth_client_secret, value: "{{ keycloak_oauth_client_secret }}" }
    - { name: oauth_cookie_secret, value: "{{ keycloak_oauth_cookie_secret }}" }
  loop_control:
    label: "{{ item.name }}"
  register: keycloak_secret_files
  when: orchestrator == 'swarm'
  no_log: true

- name: Write Keycloak stack
  when: orchestrator == 'swarm'
  ansible.builtin.template:
    src: stack.yml.j2
    dest: "{{ keycloak_dir }}/stack.yml"
    mode: "0600"
  vars:
    # Each secret's name ends with the checksum of its file (see above).
    keycloak_secret_sums: >-
      {{ dict(keycloak_secret_files.results | map(attribute='item.name')
      | zip(keycloak_secret_files.results | map(attribute='checksum') | map('truncate', 12, true, ''))) }}
  register: keycloak_stack

- name: Deploy Keycloak
  when: orchestrator == 'swarm'
  ansible.builtin.include_role:
    name: swarm
    tasks_from: deploy
  vars:
    swarm_stack: keycloak
    swarm_stack_changed: "{{ keycloak_stack.changed }}"


# k3s: a manifest in k3s's folder; k3s applies it by itself.
- name: Write Keycloak for k3s
  ansible.builtin.template:
    src: k3s.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/ansibro-keycloak.yaml
    mode: "0600"
  diff: false  # has passwords
  when: orchestrator == 'k3s'

- name: Set up Keycloak as the login for admin pages
  ansible.builtin.include_tasks: sso.yml
  when: admin_sso == 'keycloak' and 'traefik' in apps
