# Kong: API gateway behind Traefik. Stores its settings in PostgreSQL.
#   https://kong.<domain>          your APIs (routes you add in Kong)
#   https://kong-manager.<domain>  Kong Manager web UI (Traefik dashboard password)

- name: Create Kong database
  ansible.builtin.include_role:
    name: postgres
    tasks_from: database
  vars:
    postgres_db_name: kong
    postgres_db_password: "{{ kong_db_password }}"

- name: Create Kong folder
  ansible.builtin.file:
    path: "{{ kong_dir }}"
    state: directory
    mode: "0700"

# The database password is a file (secrets/db_password), not in the settings: Kong reads it from
# KONG_PG_PASSWORD_FILE. On Swarm it reaches Kong as a swarm secret, so whoever may read the swarm's
# services (Traefik, through socket-proxy, for one) does not see it. (k3s: a Kubernetes secret.)
- name: Write Kong settings
  ansible.builtin.copy:
    dest: "{{ kong_dir }}/kong.env"
    content: |
      KONG_DATABASE=postgres
      KONG_PG_HOST={{ database_host }}
      KONG_PG_DATABASE=kong
      KONG_PG_USER=kong
      KONG_PG_PASSWORD_FILE=/run/secrets/db_password
    mode: "0600"
  register: kong_env

- name: Create the folder for Kong's secrets
  ansible.builtin.file:
    path: "{{ kong_dir }}/secrets"
    state: directory
    mode: "0700"

# Readable for Kong's own user in its container (the folder above is for root only).
- name: Write Kong's database password
  ansible.builtin.copy:
    dest: "{{ kong_dir }}/secrets/db_password"
    content: "{{ kong_db_password }}"
    mode: "0644"
  register: kong_db_secret
  no_log: true

- name: Mirror Kong image
  ansible.builtin.include_role:
    name: registry
    tasks_from: mirror
  vars:
    registry_mirror_images: [kong]

# Creates or updates Kong's tables. Safe to run every time.
# Upgrade order from Kong's docs: "up" before the new Kong starts, "finish" after.
- name: Prepare Kong database
  ansible.builtin.shell:
    cmd: |
      set -e
      run="docker run --rm --env-file {{ kong_dir }}/kong.env -e KONG_PG_HOST={{ kong_pg_primary }}"
      run="$run -v {{ kong_dir }}/secrets/db_password:/run/secrets/db_password:ro"
      run="$run {{ image_ref.kong }} kong migrations"
      $run bootstrap
      $run up
    executable: /bin/bash
  register: kong_migrations
  changed_when: "'migrated' in kong_migrations.stdout or 'executed' in kong_migrations.stdout"

# Swarm: the admin API (port 8001) answers only requests with the key that Traefik adds.
# (k3s: a NetworkPolicy lets only Traefik reach Kong.)
- name: Write Kong admin API check
  when: orchestrator == 'swarm'
  ansible.builtin.copy:
    dest: "{{ kong_dir }}/admin-api.conf"
    content: |
      # Made by ansibro. Kong puts this in its admin API server (port 8001).
      if ($http_x_ansibro_admin_key != "{{ kong_admin_key }}") {
          return 403;
      }
    mode: "0600"
  register: kong_admin_conf
  no_log: true

- name: Write Kong stack
  when: orchestrator == 'swarm'
  ansible.builtin.template:
    src: stack.yml.j2
    dest: "{{ kong_dir }}/stack.yml"
    mode: "0600"
  register: kong_stack

- name: Deploy Kong
  when: orchestrator == 'swarm'
  ansible.builtin.include_role:
    name: swarm
    tasks_from: deploy
  vars:
    swarm_stack: kong
    swarm_stack_changed: "{{ kong_stack.changed or kong_env.changed or kong_admin_conf.changed or kong_db_secret.changed }}"

# k3s: a manifest in k3s's folder; k3s applies it by itself.
- name: Write Kong for k3s
  ansible.builtin.template:
    src: k3s.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/ansibro-kong.yaml
    mode: "0600"
  diff: false  # has passwords
  when: orchestrator == 'k3s'

- name: Finish Kong database changes
  ansible.builtin.command: >-
    docker run --rm --env-file {{ kong_dir }}/kong.env -e KONG_PG_HOST={{ kong_pg_primary }}
    -v {{ kong_dir }}/secrets/db_password:/run/secrets/db_password:ro
    {{ image_ref.kong }} kong migrations finish
  register: kong_finish
  changed_when: "'executed' in kong_finish.stdout"
