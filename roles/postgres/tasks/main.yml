# PostgreSQL. Apps connect to <server ip>:5432 as user "postgres".
# On 2 or more servers (postgres: [db1, db2, db3]) it runs with Patroni: one primary, the others
# follow it, and when the primary is down another one becomes the primary by itself. Cluster apps
# then connect through database-proxy, which always goes to the primary. See docs/how-to.md "Database replicas".

- name: Create PostgreSQL folder
  ansible.builtin.file:
    path: "{{ postgres_dir }}"
    state: directory
    mode: "0700"

# One server and Patroni keep their data in different ways (data/18 or data/pgroot). With the other
# kind found here, PostgreSQL would start with a new, empty database. Stop instead.
- name: Look for PostgreSQL data of the other kind
  ansible.builtin.find:
    paths: "{{ postgres_dir }}/data"
    file_type: directory
    patterns: "{{ ['[0-9]*'] if postgres_patroni else ['pgroot'] }}"
  register: postgres_other_data

- name: Stop if PostgreSQL changed between one server and more servers
  ansible.builtin.assert:
    that: postgres_other_data.matched == 0
    fail_msg: >-
      {{ inventory_hostname }} has PostgreSQL data from {{ 'one server' if postgres_patroni else 'Patroni (2 or more servers)' }},
      but config.yml now has postgres on {{ app_nodes.postgres | length }} server(s). The installer cannot change this
      in place. Put postgres in config.yml back as it was. To change it, make a backup (sudo ansibro-backup) and
      restore it on new servers with the new config.yml (docs/how-to.md, "Back up and restore").

# PostgreSQL in the container runs as user 999 (one server) or 101, group 103 (Spilo, with Patroni).
- name: Create PostgreSQL data folder
  ansible.builtin.file:
    path: "{{ postgres_dir }}/data"
    state: directory
    owner: "{{ '101' if postgres_patroni else '999' }}"
    group: "{{ '103' if postgres_patroni else '999' }}"
    mode: "0700"

- name: Write PostgreSQL passwords
  ansible.builtin.copy:
    dest: "{{ postgres_dir }}/.env"
    content: |
      POSTGRES_PASSWORD={{ postgres_password }}
      PGPASSWORD_SUPERUSER={{ postgres_password }}
      PGPASSWORD_STANDBY={{ postgres_replication_password }}
      PGPASSWORD_ADMIN={{ postgres_password }}
      {% if postgres_patroni %}
      # Spilo starts Patroni without the container's PATRONI_* settings; it adds this to Patroni's config.
      # - name and addresses: else Spilo uses the host name and its address (can be 127.0.1.1).
      # - Patroni's API: reading (health, which server is the primary) is open, changes need this login.
      # - etcd's login (user patroni). Patroni also works while etcd does not ask for it yet.
      SPILO_CONFIGURATION={{ postgres_spilo_config | to_json }}
      {% endif %}
    mode: "0600"
  register: postgres_env
  no_log: true
  vars:
    postgres_spilo_config:
      name: "{{ inventory_hostname }}"
      restapi:
        connect_address: "{{ node_ip }}:8008"
        authentication: {username: patroni, password: "{{ postgres_patroni_api_password }}"}
      postgresql:
        connect_address: "{{ node_ip }}:5432"
      etcd3: {username: patroni, password: "{{ postgres_etcd_password }}"}

- name: Mirror PostgreSQL image
  ansible.builtin.include_role:
    name: registry
    tasks_from: mirror
  vars:
    registry_mirror_images: ["{{ 'spilo' if postgres_patroni else 'postgres' }}"]

- name: Write PostgreSQL compose file
  ansible.builtin.template:
    src: "{{ 'patroni-compose.yml.j2' if postgres_patroni else 'compose.yml.j2' }}"
    dest: "{{ postgres_dir }}/compose.yml"
    mode: "0600"
  register: postgres_compose

# Patroni: a server that joins the cluster again may have an old copy of the data. It can differ
# from the primary's, and then it cannot follow the primary. So when PostgreSQL left this server
# but another server is the primary, keep the old copy aside (data/pgroot.old) and let Patroni
# make a new copy from the primary.
- name: Join the PostgreSQL cluster again with a new copy
  when: postgres_patroni
  block:
    - name: Look for old PostgreSQL data that is not running
      # No container at all (not even stopped): it left the cluster before (cleanup removes it).
      # A container that crashed or was stopped by hand keeps its data.
      ansible.builtin.shell: test -d {{ postgres_dir }}/data/pgroot && test -z "$(docker ps -aq --filter name=^postgres$)"
      register: postgres_old_copy
      failed_when: false
      changed_when: false

    - name: Ask the other servers for the primary
      ansible.builtin.uri:
        url: "http://{{ hostvars[item].node_ip }}:8008/cluster"
        timeout: 5
      loop: "{{ app_nodes.postgres | difference([inventory_hostname]) }}"
      register: postgres_others
      failed_when: false
      when: postgres_old_copy.rc == 0

    - name: Keep the old copy aside
      ansible.builtin.shell: rm -rf data/pgroot.old && mv data/pgroot data/pgroot.old  # only the newest old copy
      args:
        chdir: "{{ postgres_dir }}"
      when: >-
        postgres_old_copy.rc == 0
        and postgres_others.results | map(attribute='json', default={}) | map(attribute='members', default=[])
        | flatten | selectattr('role', 'equalto', 'leader') | selectattr('state', 'equalto', 'running')
        | rejectattr('name', 'equalto', inventory_hostname) | list | length > 0
      changed_when: true

# Patroni: a running server whose settings or image changed restarts one at a time, the primary
# last and only after it handed over to a replica (tasks/rolling.yml). Before, all of them restarted
# together, and the database was down until they agreed on a new primary.
- name: Look for a running PostgreSQL
  ansible.builtin.command: docker ps -q --filter name=^postgres$
  register: postgres_running
  changed_when: false
  when: postgres_patroni

- name: Decide how PostgreSQL starts
  ansible.builtin.set_fact:
    postgres_rolling: >-
      {{ postgres_patroni and postgres_running.stdout != '' and (postgres_env.changed or postgres_compose.changed) }}

- name: Start PostgreSQL
  ansible.builtin.include_role:
    name: docker
    tasks_from: compose
  vars:
    docker_compose_app: postgres
  when: not postgres_rolling

- name: Restart PostgreSQL one server at a time
  ansible.builtin.include_tasks: rolling.yml
  when: postgres_rolling_nodes | length > 0
  vars:
    postgres_rolling_nodes: >-
      {{ app_nodes.postgres | intersect(ansible_play_hosts) | map('extract', hostvars)
      | selectattr('postgres_rolling', 'defined') | selectattr('postgres_rolling') | map(attribute='inventory_hostname') | list }}

# With Patroni the servers agree on a primary first; then this finds it (postgres_primary_node).
- name: Find the PostgreSQL primary
  ansible.builtin.include_tasks: find_primary.yml

# Restore (./install.sh -e restore=true): load the dump from the backup into the new, empty database.
# With Patroni the dump is on the server that was the primary at backup time. The new primary
# can be another server: then the dump goes there through this machine (the one running the installer).
- name: Restore with Patroni
  when: restore | bool and postgres_patroni
  block:
    - name: Look for the PostgreSQL dump
      ansible.builtin.stat:
        path: "{{ postgres_dump }}"
      register: postgres_dump_here

    - name: Find the server with the newest PostgreSQL dump
      ansible.builtin.set_fact:
        postgres_dump_node: >-
          {{ (app_nodes.postgres | map('extract', hostvars) | selectattr('postgres_dump_here.stat.exists')
          | sort(attribute='postgres_dump_here.stat.mtime') | map(attribute='inventory_hostname') | list)[-1] | default('') }}
      run_once: true

    - name: Stop if no server has the PostgreSQL dump
      ansible.builtin.assert:
        that: postgres_dump_node != ''
        fail_msg: "No PostgreSQL dump in the backup of {{ app_nodes.postgres | join(', ') }}."
      run_once: true

    - name: Get the dump from {{ postgres_dump_node }}
      ansible.builtin.fetch:
        src: "{{ postgres_dump }}"
        dest: "{{ playbook_dir }}/state/postgres-restore.sql"
        flat: true
      delegate_to: "{{ postgres_dump_node | default(inventory_hostname) }}"  # read before "when"
      run_once: true
      when: postgres_dump_node != postgres_primary_node

    - name: Create the dump folder on the primary
      ansible.builtin.file:
        path: "{{ postgres_dump | dirname }}"
        state: directory
        mode: "0700"
      when: inventory_hostname == postgres_primary_node and postgres_dump_node != postgres_primary_node

    - name: Copy the dump to the primary
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/state/postgres-restore.sql"
        dest: "{{ postgres_dump }}"
        mode: "0600"
      when: inventory_hostname == postgres_primary_node and postgres_dump_node != postgres_primary_node

    - name: Delete the dump on this machine
      ansible.builtin.file:
        path: "{{ playbook_dir }}/state/postgres-restore.sql"
        state: absent
      delegate_to: localhost
      become: false
      run_once: true

# The dump was made with --clean: it first drops what it creates. Roles that are already here
# (postgres; with Patroni also Spilo's own) cannot be dropped, so their DROP ROLE and CREATE ROLE
# lines are left out (their ALTER ROLE lines stay). It also drops and makes again the databases
# postgres and template1, which Patroni is connected to: WITH (FORCE) closes those connections first.
# Any other error stops the restore.
- name: Load PostgreSQL backup
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      docker exec postgres psql -U postgres -tAc "SELECT quote_ident(rolname) FROM pg_roles" > {{ postgres_dump }}.roles
      awk 'NR == FNR { skip["CREATE ROLE " $0 ";"]; skip["DROP ROLE IF EXISTS " $0 ";"]; next } !($0 in skip)' \
        {{ postgres_dump }}.roles {{ postgres_dump }} \
        | sed -E 's/^(DROP DATABASE( IF EXISTS)? [^;]+);$/\1 WITH (FORCE);/' \
        | docker exec -i postgres psql -U postgres -q -v ON_ERROR_STOP=1 -f -
    executable: /bin/bash
  when: restore | bool and inventory_hostname == postgres_primary_node
  changed_when: true
