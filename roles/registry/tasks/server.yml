# Runs on every manager. The first manager makes the certificate and the password file,
# the other managers get a copy.

- name: Create registry directories
  ansible.builtin.file:
    path: "{{ registry_dir }}/{{ item }}"
    state: directory
    mode: "0700"
  loop: [ca, certs, data, auth, config]

# Full certificate fields: newer tools (for example Python 3.13+) reject certificates without them.
# The certificate is good for the registry name and the IP of every manager.
# (regex_replace '^' puts "IP:" in front of each IP.)
- name: Write certificate extensions
  ansible.builtin.copy:
    dest: "{{ registry_dir }}/ca/san.cnf"
    content: |
      subjectAltName = DNS:{{ registry_host }}, {{ groups['managers'] | map('extract', hostvars, 'node_ip') | map('regex_replace', '^', 'IP:') | join(', ') }}
      basicConstraints = critical, CA:FALSE
      keyUsage = critical, digitalSignature
      extendedKeyUsage = serverAuth
      subjectKeyIdentifier = hash
      authorityKeyIdentifier = keyid
    mode: "0600"
  register: registry_san
  when: inventory_hostname == swarm_leader

- name: Create registry CA
  ansible.builtin.command:
    cmd: >-
      openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes
      -days {{ registry_cert_days }} -subj /CN=ansibro-registry-ca
      -addext "basicConstraints = critical, CA:TRUE"
      -addext "keyUsage = critical, keyCertSign, cRLSign"
      -keyout ca.key -out ca.crt
    chdir: "{{ registry_dir }}/ca"
    creates: "{{ registry_dir }}/ca/ca.crt"
  when: inventory_hostname == swarm_leader

- name: Look for the registry certificate
  ansible.builtin.stat:
    path: "{{ registry_dir }}/certs/registry.crt"
  register: registry_cert
  when: inventory_hostname == swarm_leader

# Made again when the managers change, so it covers every manager's IP.
- name: Create registry certificate
  ansible.builtin.shell:
    cmd: >-
      openssl req -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes
      -subj /CN={{ registry_host }} -keyout ../certs/registry.key -out registry.csr &&
      openssl x509 -req -in registry.csr -CA ca.crt -CAkey ca.key -CAcreateserial
      -days {{ registry_cert_days }} -extfile san.cnf -out ../certs/registry.crt
    chdir: "{{ registry_dir }}/ca"
  when: inventory_hostname == swarm_leader and (registry_san.changed or not registry_cert.stat.exists)
  changed_when: true

# The password file holds a bcrypt hash. It is made once; the hash is different every time.
- name: Check registry password file
  ansible.builtin.stat:
    path: "{{ registry_dir }}/auth/htpasswd"
  register: registry_htpasswd
  when: inventory_hostname == swarm_leader

- name: Hash registry password
  ansible.builtin.command:
    cmd: "{{ ansible_playbook_python }} -c 'import bcrypt, sys; print(bcrypt.hashpw(sys.stdin.read().encode(), bcrypt.gensalt()).decode())'"
    stdin: "{{ registry_password }}"
    stdin_add_newline: false  # hash the password only, not a newline after it
  delegate_to: localhost
  become: false
  register: registry_hash
  when: inventory_hostname == swarm_leader and not registry_htpasswd.stat.exists
  changed_when: false
  no_log: true

- name: Write registry password file
  ansible.builtin.copy:
    dest: "{{ registry_dir }}/auth/htpasswd"
    content: "{{ registry_user }}:{{ registry_hash.stdout }}\n"
    mode: "0600"
  when: inventory_hostname == swarm_leader and not registry_htpasswd.stat.exists
  no_log: true

- name: Read the registry files of the first manager
  ansible.builtin.slurp:
    src: "{{ registry_dir }}/{{ item }}"
  loop: [certs/registry.crt, certs/registry.key, auth/htpasswd]
  delegate_to: "{{ swarm_leader }}"
  run_once: true
  register: registry_files
  no_log: true

- name: Copy the registry files to the other managers
  ansible.builtin.copy:
    dest: "{{ registry_dir }}/{{ item.item }}"
    content: "{{ item.content | b64decode }}"
    mode: "0600"
  loop: "{{ registry_files.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: inventory_hostname != swarm_leader
  register: registry_copied
  no_log: true

- name: Check if the registry image is here
  ansible.builtin.command: docker image inspect {{ registry_image }}
  register: registry_image_check
  failed_when: false
  changed_when: false

- name: Get the registry image
  ansible.builtin.shell:
    cmd: |
      set -e
      {% if offline %}
      docker load -q -i {{ bundle_dir }}/images/registry.tar.gz
      {% else %}
      docker pull -q {{ images.registry.repo }}@{{ images.registry.digest }}
      docker tag {{ images.registry.repo }}@{{ images.registry.digest }} {{ registry_image }}
      {% endif %}
    executable: /bin/bash
  when: registry_image_check.rc != 0
  changed_when: true

# Read-only. The installer makes it writable only while it pushes images (tasks/mode.yml).
- name: Write registry config
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ registry_dir }}/config/config.yml"
    mode: "0644"
  register: registry_config

- name: Write the command that opens the registry for your own images
  ansible.builtin.template:
    src: ansibro-registry.j2
    dest: /usr/local/bin/ansibro-registry
    mode: "0700"

- name: Write registry compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ registry_dir }}/compose.yml"
    mode: "0644"

# The registry reads its certificate only when it starts.
- name: Start registry
  ansible.builtin.include_role:
    name: docker
    tasks_from: compose
  vars:
    docker_compose_app: registry
    docker_compose_restart: "{{ registry_san.changed | default(false) or registry_copied.changed or registry_config.changed }}"
