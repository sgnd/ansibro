# Traefik: the HTTPS entry point for all apps. Runs on every manager (see traefik_nodes).
# Its files are written first, by files.yml (site.yml, play "Traefik files").

- name: Mirror Traefik image
  ansible.builtin.include_role:
    name: registry
    tasks_from: mirror
  vars:
    registry_mirror_images: [traefik, socket-proxy]

- name: Write Traefik stack
  ansible.builtin.template:
    src: stack.yml.j2
    dest: "{{ traefik_dir }}/stack.yml"
    mode: "0600"
  register: traefik_stack

- name: Deploy Traefik
  ansible.builtin.include_role:
    name: swarm
    tasks_from: deploy
  vars:
    swarm_stack: traefik
    swarm_stack_changed: "{{ traefik_stack.changed }}"
