# Uptime Kuma: checks that your sites and services are up.
# The installer makes the admin user (password in state/secrets/uptimekuma_admin) and a monitor for
# every app's web page, and for the monitoring server (its Watchdog alert). Log in at https://uptimekuma.<domain>.

- name: Create Uptime Kuma folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ uptimekuma_dir }}"
    - "{{ uptimekuma_dir }}/data"

- name: Mirror Uptime Kuma image
  ansible.builtin.include_role:
    name: registry
    tasks_from: mirror
  vars:
    registry_mirror_images: [uptimekuma]

# Uptime Kuma 2 asks for its database type on the first visit. SQLite (a file in data/): no question.
- name: Use SQLite for Uptime Kuma
  ansible.builtin.copy:
    dest: "{{ uptimekuma_dir }}/data/db-config.json"
    content: '{"type": "sqlite"}'
    mode: "0600"
    force: false  # keep the choice of an existing install

- name: Write Uptime Kuma compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ uptimekuma_dir }}/compose.yml"
    mode: "0600"

- name: Start Uptime Kuma
  ansible.builtin.include_role:
    name: docker
    tasks_from: compose
  vars:
    docker_compose_app: uptimekuma

- name: Write the Uptime Kuma setup script and monitors
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ uptimekuma_dir }}/data/ansibro-{{ item }}"
    mode: "0600"
  loop: [setup.js, monitors.json]

# Makes the admin user and the monitors (until all are added once), from inside the container.
# Fails if the saved password does not work (someone else made the admin user).
# With victoria, it also sets the Alertmanager login on the Watchdog monitor (see setup.js).
- name: Make the Uptime Kuma admin user and monitors
  ansible.builtin.command:
    cmd: docker exec -i uptimekuma node /app/data/ansibro-setup.js
    stdin: >-
      {{ {'username': 'admin', 'password': uptimekuma_password,
          'alertmanagerPassword': alertmanager_password if monitoring_app else ''} | to_json }}
  register: uptimekuma_setup
  until: uptimekuma_setup.rc == 0 or 'does not work' in uptimekuma_setup.stderr
  retries: 10
  delay: 6
  changed_when: "'created' in uptimekuma_setup.stdout or 'updated' in uptimekuma_setup.stdout"
  failed_when: false  # the next task shows the error (no_log hides it here)
  no_log: true

- name: Check the Uptime Kuma setup
  ansible.builtin.fail:
    msg: "{{ uptimekuma_setup.stderr }}"  # never has the password
  when: uptimekuma_setup.rc != 0

# Only now, with the admin user made: before, anyone who opens the page could make it.
# Its own login, and the admin login when Authelia or Keycloak is installed. Status pages, push
# monitors and badges are for everyone (still limited by admin_allow_from, like before).
- name: Add Uptime Kuma to Traefik
  ansible.builtin.include_role:
    name: traefik
    tasks_from: route
  vars:
    traefik_route_name: uptimekuma
    traefik_route_port: 3001
    traefik_route_middleware: sso
    traefik_route_open_paths: [/status/, /api/status-page/, /api/push/, /api/badge/, /upload/, /assets/, /icon.svg]
