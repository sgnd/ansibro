# New or changed peers: when wg0 is up, load them without taking wg0 down (wg syncconf), so the
# cluster keeps running. Only when wg0 is down, start it again.
# "wg-quick strip" leaves out PostUp, which loads the private key (wg0.conf.j2). Without the key,
# syncconf would remove it from wg0, so the key is added back in (through the environment, so it
# is never on a command line).
# (A new MTU needs a restart by hand: sudo systemctl restart wg-quick@wg0, one server at a time.)
- name: Restart wireguard
  ansible.builtin.shell: |
    set -o pipefail
    if ip link show wg0 >/dev/null 2>&1; then
      key=$(cat /etc/wireguard/private.key)
      export key
      wg syncconf wg0 <(wg-quick strip wg0 | awk '{ print } /^\[Interface\]/ { print "PrivateKey = " ENVIRON["key"] }')
      # syncconf does not change routes (wg-quick makes them only at start): add a route for each
      # new server, and remove the routes of servers that are gone.
      want=$(wg show wg0 allowed-ips | tr -s '[:blank:]' '\n' | grep / | sed 's#/32$##' | sort -u)
      for ip in $want; do
        ip route replace "$ip" dev wg0
      done
      for ip in $(ip -4 route show dev wg0 | awk '{ print $1 }'); do
        grep -qxF "$ip" <<< "$want" || ip route del "$ip" dev wg0
      done
    else
      systemctl restart wg-quick@wg0
    fi
  args:
    executable: /bin/bash
  changed_when: true
