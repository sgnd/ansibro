# Main playbook. install.sh runs it. Settings come from config.yml through inventory.py.

- name: Check servers
  hosts: all
  gather_facts: true
  any_errors_fatal: true  # one failed check stops the whole install, before anything changes
  tasks:
    - name: Check operating system
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version in ['24.04', '26.04']
        fail_msg: "Ubuntu 24.04 or 26.04 is required, found {{ ansible_distribution }} {{ ansible_distribution_version }}."

    - name: Check Ubuntu version matches the offline bundle
      ansible.builtin.assert:
        that: ansible_distribution_version == bundle.ubuntu
        fail_msg: >-
          The bundle is for Ubuntu {{ bundle.ubuntu }}, this node runs {{ ansible_distribution_version }}.
          Build one with: ./build-bundle.sh {{ ansible_distribution_version }}
      when: offline

    - name: Check CPU type
      ansible.builtin.assert:
        that: ansible_architecture == 'x86_64'
        fail_msg: >-
          {{ inventory_hostname }} has a {{ ansible_architecture }} CPU. Ansibro runs on Intel/AMD (amd64) servers only.

    # Before anything changes: does config.yml still match the swarm? (No Docker yet = a new server.)
    - name: Read swarm state
      ansible.builtin.command: docker info --format '{% raw %}{{ json .Swarm }}{% endraw %}'
      register: swarm_now
      failed_when: false
      changed_when: false
      when: inventory_hostname in groups['swarm']

    # swarm_state.LocalNodeState: "active" when the server is in a swarm.
    # swarm_state.ControlAvailable: true on a manager. swarm_state.NodeAddr: its swarm address.
    # No Docker yet (a new server): the command fails, so the state is empty.
    - name: Remember swarm state
      ansible.builtin.set_fact:
        swarm_state: "{{ swarm_now.stdout | from_json if swarm_now.rc == 0 else {} }}"
      when: inventory_hostname in groups['swarm']

    # The registry started on the first manager. If another manager has it and the first one does not,
    # the managers were reordered (or a new one was put first). Stop before anything moves.
    # It passes when the first manager has the registry, or no manager has it yet (a new install).
    - name: Look for the registry
      ansible.builtin.stat:
        path: "{{ apps_dir }}/registry/ca/ca.crt"
      register: registry_here
      when: inventory_hostname in groups['managers']

    - name: Check the first manager in config.yml has the registry
      ansible.builtin.assert:
        that: >-
          hostvars[swarm_leader].registry_here.stat.exists or
          groups['managers'] | intersect(ansible_play_hosts) | map('extract', hostvars, ['registry_here', 'stat', 'exists'])
          | select | list | length == 0
        fail_msg: >-
          {{ swarm_leader }} is listed first in config.yml, but the registry (and the swarm's start) is on another manager.
          Keep the original first manager first in the nodes list, and add new managers after it.
      run_once: true

    - name: Check each server's role matches the swarm
      ansible.builtin.assert:
        that: swarm_state.ControlAvailable == (node_role == 'manager')
        fail_msg: >-
          {{ inventory_hostname }} is {{ node_role }} in config.yml but not in the swarm. Change it by hand
          on a manager: sudo docker node {{ 'promote' if node_role == 'manager' else 'demote' }} {{ inventory_hostname }}
      when: inventory_hostname in groups['swarm'] and swarm_state.LocalNodeState | default('') == 'active'

    # k3s cannot change a server between manager (k3s.service) and worker (k3s-agent.service).
    # Look for the service of the other role: if it is there, the role in config.yml changed.
    - name: Look for the k3s service of the other role
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ 'k3s-agent' if node_role == 'manager' else 'k3s' }}.service"
      register: k3s_other_role
      when: orchestrator == 'k3s' and inventory_hostname in groups['swarm']

    - name: Check each server's role matches k3s
      ansible.builtin.assert:
        that: not k3s_other_role.stat.exists
        fail_msg: >-
          {{ inventory_hostname }} is {{ node_role }} in config.yml, but in k3s it is a
          {{ 'worker' if node_role == 'manager' else 'manager' }}. k3s cannot change this. Take the server out of
          config.yml, run ./install.sh -e remove_nodes=true, then add it back with its new role and run ./install.sh.
      when: orchestrator == 'k3s' and inventory_hostname in groups['swarm']

    # A restore is for new servers. On a running cluster it would replace the swarm and the data.
    - name: Check a restore goes to new servers
      ansible.builtin.assert:
        that: swarm_state.LocalNodeState | default('') != 'active'
        fail_msg: >-
          restore=true is only for new, empty servers, but {{ inventory_hostname }} is already in a swarm.
          To go back to a backup, install new servers and restore there.
      when: restore | bool and inventory_hostname in groups['swarm']

    - name: Look for k3s
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/server
      register: k3s_here
      when: restore | bool and orchestrator == 'k3s'

    - name: Check a k3s restore goes to new servers
      ansible.builtin.assert:
        that: not k3s_here.stat.exists
        fail_msg: >-
          restore=true is only for new, empty servers, but {{ inventory_hostname }} already runs k3s.
          To go back to a backup, install new servers and restore there.
      when: restore | bool and orchestrator == 'k3s'

    - name: Check a restore has a backup to read
      ansible.builtin.assert:
        that: backup is defined
        fail_msg: "restore=true needs the backup settings (backup: in config.yml) that the old cluster used."
      when: restore | bool
      run_once: true

    # A swarm cannot change a node's address. This happens after a snapshot restore or a move
    # to a new server, or when ip in config.yml was changed.
    - name: Check each server's swarm address matches ip in config.yml
      ansible.builtin.assert:
        that: swarm_state.NodeAddr == node_ip
        fail_msg: >-
          {{ inventory_hostname }} is in the swarm with address {{ swarm_state.NodeAddr }},
          but its ip in config.yml is {{ node_ip }}. Put {{ swarm_state.NodeAddr }} back as ip.
          If the server's real address changed, set the new one as host (with wireguard: true, ip never has to change).
      when: inventory_hostname in groups['swarm'] and swarm_state.LocalNodeState | default('') == 'active'

# Servers removed from config.yml leave the swarm (only with -e remove_nodes=true).
- name: Removed servers
  hosts: managers[0]
  gather_facts: false
  tasks:
    - name: Remove servers that are not in config.yml
      ansible.builtin.include_role:
        name: cleanup
        tasks_from: nodes

# A server that is no longer in the PostgreSQL cluster (Patroni) stops it before the firewall changes.
- name: Servers that leave the PostgreSQL cluster
  hosts: all
  gather_facts: false
  tasks:
    - name: Stop PostgreSQL where config.yml no longer has it
      ansible.builtin.include_role:
        name: cleanup
        tasks_from: postgres
      when: "'postgres' not in node_apps"

- name: Base system
  hosts: all
  environment: "{{ apt_env }}"  # offline: apt uses only the bundle
  roles:
    - role: bundle
      when: offline
    - common
    - role: wireguard
      when: wireguard
    - docker

- name: Registry
  hosts: all
  roles:
    - registry

# Only with ./install.sh -e restore=true: put the newest backup back before the swarm and apps start.
- name: Restore from backup
  hosts: all
  tasks:
    - name: Put the newest backup back
      ansible.builtin.include_role:
        name: backup
        tasks_from: restore
      when: restore | bool

# The cluster: Docker Swarm, or k3s (orchestrator in config.yml). The group "swarm" holds the
# cluster servers (managers and workers) for both.
- name: Swarm
  hosts: swarm
  roles:
    - role: swarm
      when: orchestrator == 'swarm'
    - role: k3s
      when: orchestrator == 'k3s'

# k3s: settings for its built-in Traefik.
- name: Traefik on k3s
  hosts: managers[0]
  tasks:
    - name: Set up Traefik on k3s
      ansible.builtin.include_role:
        name: traefik
        tasks_from: k3s
      when: "'traefik' in apps and orchestrator == 'k3s'"

# etcd on the managers, for PostgreSQL with Patroni (postgres on 2 or more servers).
- name: PostgreSQL cluster store
  hosts: managers
  tasks:
    - name: Run etcd for Patroni
      ansible.builtin.include_role:
        name: etcd
      when: postgres_patroni

# Apps that run on one server with Docker Compose, like databases.
- name: Server apps
  hosts: all
  tasks:
    - name: Deploy server apps
      ansible.builtin.include_role:
        name: "{{ app }}"
      loop: "{{ node_apps }}"
      loop_control:
        loop_var: app

- name: Beszel agents
  hosts: all
  tasks:
    - name: Deploy Beszel agent on every server
      ansible.builtin.include_role:
        name: beszel
        tasks_from: agent
      when: "'beszel' in apps"

# Monitoring agents on every server (metrics, logs, database stats), after the monitoring server.
- name: Monitoring agents
  hosts: all
  tasks:
    - name: Deploy monitoring agents on every server
      ansible.builtin.include_role:
        name: observability
        tasks_from: agent
      when: monitoring_app != ''

# Traefik's files go on every server it runs on (traefik_nodes in group_vars).
- name: Traefik files
  hosts: managers
  tasks:
    - name: Write Traefik files
      ansible.builtin.include_role:
        name: traefik
        tasks_from: files
      when: "'traefik' in apps and inventory_hostname in traefik_nodes and orchestrator == 'swarm'"

- name: Swarm apps
  hosts: managers[0]
  tasks:
    - name: Deploy database-proxy (the database on more servers)
      ansible.builtin.include_role:
        name: database_proxy
      when: database_ha

    - name: Deploy swarm apps
      ansible.builtin.include_role:
        name: "{{ app }}"
      # On k3s, Traefik is k3s's own (play "Traefik on k3s"); the other apps get a k3s manifest.
      loop: "{{ swarm_apps if orchestrator == 'swarm' else swarm_apps | difference(['traefik']) }}"
      loop_control:
        loop_var: app

# Apps removed from config.yml stop (their data stays).
- name: Removed apps
  hosts: all
  tasks:
    - name: Stop apps that are not in config.yml
      ansible.builtin.include_role:
        name: cleanup

- name: Backup
  hosts: all
  tasks:
    - name: Set up the nightly backup
      ansible.builtin.include_role:
        name: backup
      when: backup is defined

- name: Summary
  hosts: managers[0]
  gather_facts: false
  tasks:
    - name: Create state folder
      ansible.builtin.file:
        path: "{{ playbook_dir }}/state"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Save summary to state/summary.md
      ansible.builtin.template:
        src: templates/summary.md.j2
        dest: "{{ playbook_dir }}/state/summary.md"
        mode: "0600"
      delegate_to: localhost
      become: false
      diff: false  # has passwords
      changed_when: false  # the date in it changes every run

    # For tools that write handover documents (like dejavu). Only facts, no passwords.
    - name: Save facts to state/handover.json
      ansible.builtin.template:
        src: templates/handover.json.j2
        dest: "{{ playbook_dir }}/state/handover.json"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Show DNS setting
      ansible.builtin.debug:
        msg: "DNS for *.{{ domain }} must point to the public IP of {{ traefik_nodes | join(', ') }}."

    - name: Show how to reach each app
      ansible.builtin.debug:
        msg: "{{ app }}: {{ catalog[app].info | replace('<domain>', domain) | replace('<ip>', hostvars[target].node_ip | default(''))
          | replace('<admin login>', admin_login) }}"
      vars:
        app: "{{ item.key }}"
        target: "{{ item.value }}"
      loop: "{{ apps | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Show where the summary is
      ansible.builtin.debug:
        msg: >-
          All of this, plus the passwords, is saved in {{ playbook_dir }}/state/summary.md. Back up state/.
          If state/ is kept encrypted, run scripts/state.sh open to read it, and scripts/state.sh close after.

# The monitoring server muted alerts while the installer ran (roles/observability/tasks/server.yml).
# End the mute in 3 minutes: by then every server and app reports in, so alerts that fired only
# because something was not up yet are resolved and are not sent.
- name: Unmute alerts
  hosts: all
  gather_facts: false
  tasks:
    - name: End the mute in 3 minutes
      ansible.builtin.include_role:
        name: observability
        tasks_from: mute
      vars:
        observability_mute_seconds: 180
      when: monitoring_app != '' and inventory_hostname == apps[monitoring_app] and observability_mute.json is defined
