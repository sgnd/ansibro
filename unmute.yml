# Ends the installer's mute of alerts now, and makes the registry read-only again. install.sh runs it
# when site.yml fails, so alerts are sent again right away and the registry takes no pushes (a good
# install does both itself: the last plays in site.yml).
# Run it by hand too: .venv/bin/ansible-playbook unmute.yml
- name: Unmute alerts
  hosts: all
  gather_facts: false
  tasks:
    - name: End the installer's mute on the monitoring server
      when: monitoring_app != '' and inventory_hostname == apps[monitoring_app]
      block:
        # Alertmanager asks for its login (alertmanager_password in group_vars).
        - name: List the silences
          ansible.builtin.uri:
            url: "http://{{ node_ip }}:{{ observability_alertmanager_port | default(9093) }}/api/v2/silences"
            url_username: "{{ alertmanager_user }}"
            url_password: "{{ alertmanager_password }}"
            force_basic_auth: true
          register: unmute_silences
          failed_when: false  # Alertmanager may not run yet: then nothing is muted

        - name: End the silences the installer made
          ansible.builtin.uri:
            url: "http://{{ node_ip }}:{{ observability_alertmanager_port | default(9093) }}/api/v2/silence/{{ item.id }}"
            method: DELETE
            url_username: "{{ alertmanager_user }}"
            url_password: "{{ alertmanager_password }}"
            force_basic_auth: true
          loop: >-
            {{ unmute_silences.json | default([]) | selectattr('createdBy', 'equalto', 'ansibro')
            | selectattr('status.state', 'equalto', 'active') | list }}
          loop_control:
            label: "{{ item.id }}"
          changed_when: true

- name: Registry read-only
  hosts: managers[0]
  gather_facts: false
  tasks:
    - name: Make the registry read-only again
      ansible.builtin.include_role:
        name: registry
        tasks_from: mode
      vars:
        registry_mode: close
